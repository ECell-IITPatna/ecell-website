<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arc Reactor Scroll Glow</title>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    height:500vh;
    overflow-x:hidden;
}

.scene{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.reactor-wrapper{
    position:relative;
    width:320px;
    height:320px;
}

.reactor{

    width:100%;
    height:100%;
    object-fit:contain;
    position:relative;
    z-index:5;

    filter:
        brightness(1)
        drop-shadow(0 0 10px #8fefff);

    transform:scale(1);
}

.glow{

    position:absolute;
    left:50%;
    top:50%;

    width:180px;
    height:180px;

    transform:translate(-50%,-50%) scale(.5);

    border-radius:50%;

    background:radial-gradient(circle,
    rgba(255,255,255,1) 0%,
    rgba(160,240,255,.8) 20%,
    rgba(120,220,255,.35) 40%,
    rgba(120,220,255,0) 75%);

    filter:blur(50px);

    opacity:.4;

    z-index:1;
}

.white-overlay{

    position:fixed;
    inset:0;

    background:white;

    opacity:0;

    pointer-events:none;

    z-index:50;
}

</style>

</head>

<body>

<div class="scene">

    <div class="reactor-wrapper">

        <div class="glow"></div>

        <img
        src="arc-reactor.png"
        class="reactor"
        />

    </div>

</div>

<div class="white-overlay"></div>

<script>

gsap.registerPlugin(ScrollTrigger);

let tl = gsap.timeline({

    scrollTrigger:{

        trigger:document.body,

        start:"top top",

        end:"bottom bottom",

        scrub:true

    }

});

tl.to(".reactor",{

    filter:
    "brightness(8) drop-shadow(0 0 120px rgba(180,255,255,1))",

    scale:1.03,

    ease:"none"

},0);

tl.to(".glow",{

    scale:7,

    opacity:1,

    filter:"blur(140px)",

    ease:"none"

},0);

tl.to(".white-overlay",{

    opacity:1,

    ease:"none"

},0.75);

</script>

</body>
</html>
